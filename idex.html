
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #26364b;
            background: linear-gradient(#dceaf4, #fff0d8);
            min-height: 100vh;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 20px 30px;
            position: relative;
        }

        .voltar {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #193653;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 46px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .descricao {
            color: #697589;
            text-align: center;
            margin-bottom: 25px;
        }

        .cartao {
            width: 100%;
            max-width: 460px;
            padding: 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid white;
            box-shadow: 0 10px 30px #00000010;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d5d5d5;
            border-radius: 14px;
            font-size: 15px;
            background: white;
        }

        .cadastrar {
            padding: 17px;
            border: none;
            border-radius: 14px;
            background: #edbd70;
            color: #26364b;
            font-size: 16px;
            cursor: pointer;
        }

        .ou {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #788294;
        }

        .ou::before,
        .ou::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #d5d5d5;
        }

        .google {
            width: 100%;
            padding: 15px;
            border: 1px solid #d5d5d5;
            border-radius: 14px;
            background: white;
            cursor: pointer;
        }

        .login {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
        }

        .login a {
            color: #bd8736;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 38px;
            }

            .cartao {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <a href="#" class="voltar">‹ Voltar</a>

        <h1>Criar conta</h1>

        <p class="descricao">
            Entre para viver essa jornada com a gente.
        </p>

        <div class="cartao">

            <form>
                <input type="text" placeholder="Nome completo" required>

                <input type="email" placeholder="E-mail" required>

                <input type="tel" placeholder="Telefone (opcional)">

                <input type="password" placeholder="Senha" required>

                <input type="password" placeholder="Confirmar senha" required>

                <button class="cadastrar" type="submit">
                    Cadastrar →
                </button>
            </form>

            <div class="ou">ou</div>

            <button class="google" type="button">
                Continuar com o Google
            </button>

            <p class="login">
                Já tem uma conta? <a href="#">Entrar</a>
            </p>

        </div>

    </div>

</body>
</html>
