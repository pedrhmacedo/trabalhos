<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="cadastro">

        <h1>Criar conta</h1>

        <p>Crie sua conta para entrar na biblioteca.</p>

        <form>

            <input
                type="text"
                placeholder="Nome de usuário"
                required
            >

            <input
                type="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                placeholder="Senha"
                required
            >

            <input
                type="password"
                placeholder="Confirmar senha"
                required
            >

            <button type="button" onclick="location.href='principal.html'">
                Criar conta
            </button>

        </form>

    </main>

</body>

</html>
